name: aula-etl

x-airflow-common: &airflow-common
  image: apache/airflow:3.3.1
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "${AIRFLOW_PARALLELISM:-4}"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-2}"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__LOAD_EXAMPLES: "${AIRFLOW_LOAD_EXAMPLES:-false}"
    AIRFLOW_CONN_POSTGRES_DEFAULT: '{"conn_type":"postgres","host":"postgres","port":5432,"schema":"${POSTGRES_DB}","login":"${POSTGRES_USER}","password":"${POSTGRES_PASSWORD}"}'
    AIRFLOW_CONN_MSSQL_ADVENTUREWORKS: '{"conn_type":"mssql","host":"sqlserver","port":1433,"schema":"AdventureWorks2019","login":"sa","password":"${MSSQL_SA_PASSWORD:-Password123!}"}'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: "${AIRFLOW_LOGGING_LEVEL:-WARNING}"
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-apache-airflow-providers-postgres apache-airflow-providers-microsoft-mssql apache-airflow-providers-standard pandas}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    shm_size: 128mb
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: aula-etl-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Password123!}"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver-data-volume:/var/opt/mssql
      - sqlserver-backup-volume:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-Password123!}\" -Q \"SELECT 1\" || /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-Password123!}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    restart: unless-stopped

  sqlserver-backup:
    image: curlimages/curl:8.12.1
    user: "0:0"
    volumes:
      - sqlserver-backup-volume:/backup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -s /backup/AdventureWorks2019.bak ]; then
          echo "Baixando o backup AdventureWorks2019..."
          curl --fail --location --retry 3 --output /backup/AdventureWorks2019.bak https://github.com/Microsoft/sql-server-samples/releases/download/adventureworks/AdventureWorks2019.bak
        else
          echo "Backup AdventureWorks2019 ja esta disponivel."
        fi
    restart: "no"

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    user: root
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-backup:
        condition: service_completed_successfully
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Password123!}"
    volumes:
      - sqlserver-data-volume:/var/opt/mssql
      - sqlserver-backup-volume:/var/opt/mssql/backup
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
          sqlcmd() { /opt/mssql-tools18/bin/sqlcmd -C -b "$$@"; }
        elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then
          sqlcmd() { /opt/mssql-tools/bin/sqlcmd -b "$$@"; }
        else
          echo "sqlcmd nao encontrado na imagem SQL Server."
          exit 1
        fi
        echo "Verificando se o banco AdventureWorks2019 ja existe no SQL Server..."
        DB_EXISTS=$$(sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -h -1 -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name = 'AdventureWorks2019'" | tr -d '[:space:]')
        if [ "$$DB_EXISTS" != "1" ]; then
          if [ ! -s /var/opt/mssql/backup/AdventureWorks2019.bak ]; then
            echo "Backup AdventureWorks2019 ausente; o download nao foi concluido."
            exit 1
          fi
          echo "Restaurando o banco AdventureWorks2019 no SQL Server..."
          sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -Q "RESTORE DATABASE [AdventureWorks2019] FROM DISK = '/var/opt/mssql/backup/AdventureWorks2019.bak' WITH MOVE 'AdventureWorks2019' TO '/var/opt/mssql/data/AdventureWorks2019.mdf', MOVE 'AdventureWorks2019_log' TO '/var/opt/mssql/data/AdventureWorks2019_log.ldf', REPLACE"
          echo "AdventureWorks2019 restaurado com sucesso!"
        else
          echo "Banco AdventureWorks2019 ja esta restaurado e pronto para uso!"
        fi
    restart: "no"

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"
    mem_limit: 768m

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 768m

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    mem_limit: 768m

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 512m

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 512m

volumes:
  postgres-db-volume:
  sqlserver-data-volume:
  sqlserver-backup-volume:
